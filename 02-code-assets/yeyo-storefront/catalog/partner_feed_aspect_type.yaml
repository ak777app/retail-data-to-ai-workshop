# Dataplex Universal Catalog aspect type: one label for every partner stock asset,
# whichever cloud or engine holds it. Used by tag_partner_feeds.sh.
name: yeyo-partner-feed
type: record
recordFields:
  - name: partner
    type: string
    index: 1
    annotations: {displayName: Partner}
    constraints: {required: true}
  - name: seller_id
    type: string
    index: 2
    annotations: {displayName: Seller ID}
  - name: cloud
    type: string
    index: 3
    annotations: {displayName: Cloud}
    constraints: {required: true}
  - name: storage
    type: string
    index: 4
    annotations: {displayName: Storage}
  - name: table_format
    type: string
    index: 5
    annotations: {displayName: Table format}
  - name: written_by
    type: string
    index: 6
    annotations: {displayName: Written by}
  - name: refresh
    type: string
    index: 7
    annotations: {displayName: Refresh}
